[package]
name = "akey-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "akey 메뉴바(트레이) 앱"

# macOS: 실행 파일 이름은 akey (인자가 있으면 CLI 로 동작)
# Windows: 트레이 앱은 akey-app.exe, CLI 는 akey-cli 크레이트의 akey.exe
[[bin]]
name = "akey-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
akey-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
arboard = "3"

[target.'cfg(target_os = "macos")'.dependencies]
akey-macos.workspace = true
akey-cli.workspace = true

[target.'cfg(windows)'.dependencies]
akey-windows.workspace = true
